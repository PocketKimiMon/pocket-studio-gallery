<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Marketing" name="Marketing site" subtitle="PocketStudio.com — hero, manifesto, products, CTA" viewport="1120x900" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketStudio — tools for brains the manuals forgot</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ink-900); color: var(--fg1); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden; }
  body::after { content:""; position: fixed; inset: 0; background-image: var(--grain);
    background-size: 200px 200px; opacity: 0.22; mix-blend-mode: soft-light; pointer-events: none; z-index: 1; }
  #app { position: relative; z-index: 2; }
  a { color: inherit; text-decoration: none; }

  /* shared buttons */
  .mk-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 18px; border-radius: var(--radius-pill); font-weight: 700; font-size: 15px; white-space: nowrap;
    border: 1px solid transparent; cursor: pointer; transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-base), background var(--dur-base), color var(--dur-base); }
  .mk-btn:active { transform: scale(.97); }
  .mk-btn-lg { min-height: 52px; padding: 0 24px; font-size: 16px; }
  .mk-btn-block { width: 100%; }
  .mk-btn-primary { background: var(--oxblood); color: var(--on-primary); box-shadow: var(--glow-oxblood); }
  .mk-btn-primary:hover { background: var(--oxblood-bright); }
  .mk-btn-ghost { background: transparent; color: var(--fg1); border-color: var(--border); }
  .mk-btn-ghost:hover { background: var(--surface); border-color: var(--border); }

  /* logo */
  .ps-logo { display: inline-flex; align-items: center; gap: 10px; }
  .ps-mark { width: 38px; height: 38px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    background: var(--oxblood); color: var(--on-primary); border: none;
    font-family: var(--font-display); font-weight: 900; font-size: 21px; position: relative; flex: none; }
  .ps-mark::after { content: ""; position: absolute; bottom: 5px; right: 5px; width: 6px; height: 6px; background: var(--lime); }
  .ps-mark-sp { display: none; }
  .ps-wm { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }
  .ps-wm span { color: var(--oxblood-bright); }

  /* header */
  .mk-header { position: sticky; top: 0; z-index: 50; background: rgba(12,10,18,0.72);
    backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); }
  .mk-header-in { max-width: 1120px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  .mk-nav-desktop { display: none; align-items: center; gap: 22px; }
  .mk-nav-desktop a:not(.mk-btn) { font-weight: 600; font-size: 15px; color: var(--fg2); transition: color var(--dur-base); }
  .mk-nav-desktop a:not(.mk-btn):hover { color: var(--fg1); }
  .mk-burger { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px;
    border-radius: var(--radius-md); background: transparent; border: 1px solid var(--border); color: var(--fg1); cursor: pointer; }
  .mk-sheet { display: flex; flex-direction: column; gap: 4px; padding: 8px 20px 18px; border-bottom: 1px solid var(--hairline); }
  .mk-sheet a:not(.mk-btn) { min-height: 48px; display: flex; align-items: center; font-weight: 600; font-size: 17px; color: var(--fg1); border-bottom: 1px solid var(--hairline); }
  .mk-sheet-row { padding: 12px 0; }
  .mk-sheet .mk-btn { margin-top: 10px; }

  /* hero */
  .mk-hero { position: relative; overflow: hidden; }
  .mk-hero-in { max-width: 1120px; margin: 0 auto; padding: 56px 20px 40px; }
  .mk-bloom { position: absolute; top: -120px; left: 50%; transform: translateX(-50%); width: 560px; height: 560px;
    background: radial-gradient(circle, rgba(197,59,56,0.20), transparent 62%); filter: blur(20px); pointer-events: none; }
  .mk-kick { display: inline-block; margin-bottom: 18px; }
  .mk-hero-h { font-family: var(--font-display); font-weight: 900; font-size: var(--text-5xl);
    line-height: 0.94; letter-spacing: -0.035em; text-transform: uppercase; text-wrap: balance; }
  .mk-em { font-style: normal; font-weight: 900; color: var(--lime-bright); }
  .mk-hero-p { max-width: 540px; margin-top: 22px; }
  .mk-hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .mk-trust { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 34px; }
  .mk-trust span { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono);
    font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg3); }
  .mk-trust span svg { color: var(--lime); }

  /* sections */
  .mk-section { max-width: 1120px; margin: 0 auto; padding: 56px 20px; }
  .mk-section-head { max-width: 720px; margin-bottom: 32px; }
  .mk-h2 { font-family: var(--font-display); font-weight: 800; font-size: var(--text-3xl); line-height: 1.08;
    letter-spacing: -0.025em; margin-top: 14px; text-wrap: balance; }

  /* principles */
  .mk-principles { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .mk-principle { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 22px; }
  .mk-principle-ic { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center;
    border-radius: 12px; background: color-mix(in oklab, var(--oxblood) 14%, transparent); color: var(--oxblood-bright); margin-bottom: 14px; }
  .mk-principle h3 { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
  .mk-principle p { font-size: 15px; color: var(--fg2); line-height: 1.55; }

  /* products */
  .mk-products { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .mk-product { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: 22px; transition: transform var(--dur-base) var(--ease-spring), border-color var(--dur-base), box-shadow var(--dur-base); }
  .mk-product:hover { transform: translateY(-3px); }
  .mk-product-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .mk-product-ic { display: inline-flex; width: 46px; height: 46px; align-items: center; justify-content: center;
    border-radius: 12px; background: var(--ink-700); }
  .mk-product-tag { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: var(--ink-700); }
  .mk-product h3 { font-size: 21px; font-weight: 700; margin-bottom: 6px; }
  .mk-product p { font-size: 15px; color: var(--fg2); line-height: 1.55; flex: 1; }
  .mk-product-go { display: inline-flex; align-items: center; gap: 6px; margin-top: 16px; font-weight: 700; font-size: 14px; }
  /* per-product accent */
  .mk-accent-cyan:hover { border-color: transparent; box-shadow: var(--glow-cyan); }
  .mk-accent-cyan .mk-product-ic, .mk-accent-cyan .mk-product-go { color: var(--cyan); }
  .mk-accent-coral:hover { border-color: transparent; box-shadow: 0 0 0 1px rgba(255,92,92,.5), 0 0 24px -4px rgba(255,92,92,.6); }
  .mk-accent-coral .mk-product-ic, .mk-accent-coral .mk-product-go { color: var(--coral-bright); }
  .mk-accent-violet:hover { border-color: transparent; box-shadow: var(--glow-violet); }
  .mk-accent-violet .mk-product-ic, .mk-accent-violet .mk-product-go { color: var(--violet-bright); }
  .mk-accent-lime:hover { border-color: transparent; box-shadow: var(--glow-lime); }
  .mk-accent-lime .mk-product-ic, .mk-accent-lime .mk-product-go { color: var(--lime); }

  /* cta */
  .mk-cta { position: relative; overflow: hidden; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); margin-top: 24px; }
  .mk-cta-in { max-width: 760px; margin: 0 auto; padding: 64px 20px; text-align: center; }
  .mk-cta-h { font-family: var(--font-display); font-weight: 900; font-size: var(--text-4xl); line-height: 1.0;
    letter-spacing: -0.03em; text-transform: uppercase; margin: 14px 0 18px; text-wrap: balance; }
  .mk-cta-form { display: flex; flex-direction: column; gap: 10px; max-width: 460px; margin: 26px auto 0; }
  .mk-input { min-height: 52px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 0 20px; color: var(--fg1); font-family: var(--font-sans); font-size: 16px; text-align: center; }
  .mk-input::placeholder { color: var(--fg3); }
  .mk-fineprint { margin-top: 16px; font-size: 13px; color: var(--fg3); }

  /* footer */
  .mk-footer-in { max-width: 1120px; margin: 0 auto; padding: 40px 20px 56px; display: flex; flex-direction: column; gap: 16px; }
  .mk-footer-tag { font-size: 15px; color: var(--fg2); max-width: 420px; }
  .mk-footer-links { display: flex; flex-wrap: wrap; gap: 18px; }
  .mk-footer-links a { font-weight: 600; font-size: 14px; color: var(--fg2); }
  .mk-footer-links a:hover { color: var(--oxblood-bright); }
  .mk-footer-copy { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); letter-spacing: 0.02em; }

  /* desktop */
  @media (min-width: 760px) {
    .mk-nav-desktop { display: flex; }
    .mk-burger { display: none; }
    .mk-principles { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .mk-products { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .mk-hero-in { padding: 88px 20px 64px; }
    .mk-section { padding: 80px 20px; }
  }
  @media (min-width: 1040px) {
    .mk-products { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="text/babel" src="../../assets/reading-mode-toggle.kit.jsx"></script>
  <script type="text/babel" src="../../assets/icons.jsx"></script>
  <script type="text/babel" src="Header.jsx"></script>

</html>
