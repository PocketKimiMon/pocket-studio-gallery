<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Agent Dashboard" name="AI Agent Dashboard" subtitle="Sidebar/bottom-tab app — agents, runs, create flow" viewport="1120x760" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketStudio — Agent Dashboard</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink-900); color: var(--fg1); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  body::after { content:""; position: fixed; inset: 0; background-image: var(--grain); background-size: 200px 200px; opacity: 0.18; mix-blend-mode: soft-light; pointer-events: none; z-index: 1; }
  button { font-family: inherit; cursor: pointer; }

  /* brand mark (shared) */
  .ps-mark { width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    background: var(--oxblood); color: var(--on-primary); border: none;
    font-family: var(--font-display); font-weight: 900; font-size: 18px; position: relative; flex: none; }
  .ps-mark::after { content: ""; position: absolute; bottom: 4px; right: 4px; width: 5px; height: 5px; background: var(--lime); }
  .ps-mark-sp { display: none; }

  /* buttons */
  .ad-btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px;
    border-radius: var(--radius-pill); font-weight: 700; font-size: 14px; border: 1px solid transparent; white-space: nowrap;
    transition: transform var(--dur-fast) var(--ease-spring), background var(--dur-base), box-shadow var(--dur-base); }
  .ad-btn:active { transform: scale(.97); }
  .ad-btn-sm { min-height: 36px; font-size: 13px; padding: 0 12px; }
  .ad-btn-block { width: 100%; }
  .ad-btn-primary { background: var(--cyan); color: var(--on-neon); box-shadow: var(--glow-cyan); }
  .ad-btn-ghost { background: var(--surface-2); color: var(--fg1); border-color: var(--border); }
  .ad-btn-danger { color: var(--coral-bright); border-color: var(--coral-deep); background: transparent; }
  .ad-iconbtn { position: relative; width: 44px; height: 44px; border-radius: var(--radius-md); display: inline-flex;
    align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--border); color: var(--fg1); }
  .ad-notif-dot { position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .ad-link { color: var(--cyan); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }

  /* layout */
  .ad-app { min-height: 100vh; display: flex; }
  .ad-sidebar { display: none; }
  .ad-main { flex: 1; min-width: 0; padding-bottom: 78px; }

  /* topbar */
  .ad-topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; background: rgba(12,10,18,0.78); backdrop-filter: blur(14px); border-bottom: 1px solid var(--hairline); }
  .ad-topbar-title { font-family: var(--font-serif); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
  .ad-topbar-actions { display: flex; gap: 10px; }

  /* screen */
  .ad-screen { max-width: 920px; margin: 0 auto; padding: 18px 18px 28px; }
  .ad-screen-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .ad-screen-head h1, .ad-screen h1 { font-family: var(--font-serif); font-weight: 700; font-size: var(--text-3xl); letter-spacing: -0.02em; line-height: 1.05; }
  .kicker { display: block; margin-bottom: 6px; }

  .ad-tldr { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
    padding: 16px 18px; margin-bottom: 18px; }
  .ad-tldr p { font-size: 16px; color: var(--fg1); font-weight: 500; }

  /* stats */
  .ad-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 22px; }
  .ad-stats-3 { grid-template-columns: repeat(3, 1fr); }
  .ad-stat { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .ad-stat-ic { margin-bottom: 6px; }
  .ad-stat-val { font-family: var(--font-serif); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: -0.02em; }
  .ad-stat-lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); letter-spacing: 0.04em; text-transform: uppercase; }

  /* blocks */
  .ad-block { margin-bottom: 22px; }
  .ad-block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .ad-block-head h2 { font-size: 17px; font-weight: 700; }

  .ad-attention { display: flex; align-items: center; gap: 12px; background: color-mix(in oklab, var(--coral) 12%, var(--surface));
    border: 1px solid var(--coral-deep); border-radius: var(--radius-lg); padding: 14px 16px; }
  .ad-attention-ic { display: inline-flex; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: 10px; background: color-mix(in oklab, var(--coral) 22%, transparent); color: var(--coral-bright); flex: none; }
  .ad-attention-main { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .ad-attention-main strong { font-size: 14px; }
  .ad-attention-main span { font-size: 13px; color: var(--fg2); }

  /* runs */
  .ad-runs { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
  .ad-run { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--hairline); }
  .ad-run:last-child { border-bottom: none; }
  .ad-run-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .ad-run-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .ad-run-title { font-size: 14px; font-weight: 600; }
  .ad-run-sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }
  .ad-run-state { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }

  /* agent cards */
  .ad-agents { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .ad-agent { text-align: left; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column;
    transition: transform var(--dur-base) var(--ease-spring), border-color var(--dur-base), box-shadow var(--dur-base); }
  .ad-agent:hover { transform: translateY(-2px); border-color: var(--border); }
  .ad-agent-live { box-shadow: var(--glow-cyan); border-color: transparent; }
  .ad-agent-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .ad-agent-ic { display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center; border-radius: 12px; background: var(--ink-700); }
  .ad-agent-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .ad-agent-desc { font-size: 14px; color: var(--fg2); line-height: 1.5; }
  .ad-agent-foot { display: flex; gap: 16px; margin-top: 14px; }
  .ad-meta { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--fg3); }

  /* badge */
  .ad-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .ad-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* detail */
  .ad-back { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--fg2); font-weight: 600; font-size: 14px; margin-bottom: 16px; }
  .ad-back:hover { color: var(--fg1); }
  .ad-detail-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .ad-detail-ic { width: 56px; height: 56px; border-radius: 15px; flex: none; }
  .ad-detail-meta h1 { font-size: var(--text-2xl); }
  .ad-detail-meta p { font-size: 15px; color: var(--fg2); margin-top: 4px; }
  .ad-detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }

  /* settings */
  .ad-settings { display: flex; flex-direction: column; gap: 12px; }
  .ad-setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px 18px; }
  .ad-setting > div { display: flex; flex-direction: column; gap: 3px; }
  .ad-setting strong { font-size: 15px; }
  .ad-setting span { font-size: 13px; color: var(--fg2); }
  .ad-pill, .ad-pill-on { font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px; background: var(--surface-2); color: var(--fg2); border: 1px solid var(--border); }
  .ad-pill-on { background: color-mix(in oklab, var(--lime) 16%, transparent); color: var(--lime); border-color: transparent; }

  /* skeleton + empty */
  .ad-sk { background: linear-gradient(90deg, var(--ink-700) 25%, var(--ink-600) 37%, var(--ink-700) 63%); background-size: 400% 100%; animation: adsh 1.4s ease infinite; }
  @keyframes adsh { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  .ad-empty { text-align: center; padding: 40px 20px; }
  .ad-empty-ic { display: inline-flex; width: 56px; height: 56px; align-items: center; justify-content: center; border-radius: 16px; background: color-mix(in oklab, var(--violet) 16%, transparent); color: var(--violet-bright); margin-bottom: 14px; }
  .ad-empty h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .ad-empty p { font-size: 14px; color: var(--fg2); margin-bottom: 16px; }

  /* modal / create sheet */
  .ad-modal { position: fixed; inset: 0; z-index: 80; background: rgba(8,6,13,0.6); backdrop-filter: blur(6px); display: flex; align-items: flex-end; justify-content: center; }
  .ad-sheet { width: 100%; max-width: 460px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius-xl) var(--radius-xl) 0 0; padding: 20px; animation: adup var(--dur-slow) var(--ease-spring); }
  @keyframes adup { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ad-sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .ad-sheet-head h2 { font-family: var(--font-serif); font-weight: 700; font-size: 22px; }
  .ad-form { display: flex; flex-direction: column; gap: 14px; }
  .ad-field { display: flex; flex-direction: column; gap: 6px; }
  .ad-field span { font-size: 13px; font-weight: 600; }
  .ad-input { min-height: 48px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0 14px; color: var(--fg1); font-family: var(--font-sans); font-size: 15px; }
  .ad-input::placeholder { color: var(--fg3); }
  .ad-hint { font-size: 13px; color: var(--fg3); }
  .ad-confirm { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--lime); background: color-mix(in oklab, var(--lime) 10%, transparent); border-radius: var(--radius-md); padding: 12px 14px; }
  .ad-sheet-foot { display: flex; gap: 10px; margin-top: 18px; }

  /* bottom tab (mobile) */
  .ad-bottomtab { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; display: flex; gap: 2px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(12,10,18,0.82); backdrop-filter: blur(14px); border-top: 1px solid var(--hairline); }
  .ad-tab { flex: 1; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border-radius: var(--radius-md); background: none; border: none; color: var(--fg3); font-weight: 600; font-size: 11px; }
  .ad-tab.active { color: var(--cyan-bright); background: color-mix(in oklab, var(--cyan) 14%, transparent); }

  /* desktop: sidebar */
  @media (min-width: 860px) {
    .ad-sidebar { display: flex; flex-direction: column; width: 248px; flex: none; padding: 20px 16px; gap: 22px;
      border-right: 1px solid var(--hairline); position: sticky; top: 0; height: 100vh; }
    .ad-brand { display: flex; align-items: center; gap: 10px; padding: 4px; }
    .ad-brand-wm { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; text-transform: uppercase; }
    .ad-brand-wm span { color: var(--cyan-bright); }
    .ad-side-nav { display: flex; flex-direction: column; gap: 4px; }
    .ad-side-link { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: var(--radius-md);
      background: none; border: none; color: var(--fg2); font-weight: 600; font-size: 15px; text-align: left; }
    .ad-side-link:hover { background: var(--surface); color: var(--fg1); }
    .ad-side-link.active { background: color-mix(in oklab, var(--cyan) 14%, transparent); color: var(--cyan-bright); }
    .ad-side-foot { margin-top: auto; }
    .ad-bottomtab { display: none; }
    .ad-main { padding-bottom: 0; }
    .ad-create-sm { display: none; }
    .ad-stats { grid-template-columns: repeat(4, 1fr); }
    .ad-agents { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../../assets/reading-mode-toggle.kit.jsx"></script>
  <script type="text/babel" src="../../assets/icons.jsx"></script>
  <script type="text/babel" src="Parts.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>
  <script type="text/babel" src="AppShell.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const TITLES = { home: 'Home', agents: 'Agents', runs: 'Runs', you: 'You' };
    function App() {
      const [tab, setTab] = useState('home');
      const [agent, setAgent] = useState(null);
      const [create, setCreate] = useState(false);
      const [loading, setLoading] = useState(false);

      function changeTab(t) { setAgent(null); setTab(t); if (t === 'agents') { setLoading(true); setTimeout(() => setLoading(false), 900); } }

      let screen;
      if (agent) screen = <AgentDetail agent={agent} back={() => setAgent(null)} />;
      else if (tab === 'home') screen = <Overview go={changeTab} />;
      else if (tab === 'agents') screen = <Agents openAgent={setAgent} openCreate={() => setCreate(true)} loading={loading} />;
      else if (tab === 'runs') screen = <Overview go={changeTab} />;
      else screen = <Settings />;

      const title = agent ? 'Agent' : TITLES[tab];
      return (
        <div className="ad-app">
          <Sidebar tab={tab} setTab={changeTab} />
          <div className="ad-main">
            <TopBar title={title} onCreate={() => setCreate(true)} />
            {screen}
          </div>
          <BottomTab tab={tab} setTab={changeTab} />
          <CreateSheet open={create} close={() => setCreate(false)} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
  <script src="../../assets/reading-mode.js"></script>
</body>
</html>
